name: Docs

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: python -m pip install -r scripts/requirements-contract.txt

      # Schemas and examples are discovered by layout; see docs/schemas/README.md.
      - run: python scripts/check-contract.py

      - name: Embedded tool schemas are current
        run: python scripts/embed-tool-schemas.py --check

  acceptance:
    name: Acceptance client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Standard library only. The end-to-end test makes certificates with the runner's openssl, and a
      # rendering test parses the Job with Ruby's YAML library; both are on the runner, so neither may skip.
      - run: python -m unittest discover -s acceptance/tests -v
        env:
          DESKHAND_REQUIRE_E2E: '1'

      - name: Render a Job
        run: python acceptance/render-job.py --node ci-node --mac m1max2021 --run-id ci --port 8443 > /dev/null

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ignores (including docs/prompts/**) come from .markdownlint-cli2.jsonc.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline mode (lychee.toml): relative links and anchors only, so the job cannot flake on remote hosts.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml './**/*.md'
          failIfEmpty: false
          jobSummary: false
