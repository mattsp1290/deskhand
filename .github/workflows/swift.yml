name: Swift

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux runners only. macOS-only targets are compiled out by `#if os(macOS)` in Package.swift,
# so these jobs cover DeskhandCore, DeskhandServer and their tests. DESKHAND_MAC_SESSION_TESTS
# is intentionally never set here.
jobs:
  build-test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12 # 6.2-noble (6.2.4), multi-arch index
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # The digest prefix stops a .build made by another image from being restored after a re-pin.
          key: swift-6.2-noble-3459518b-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-6.2-noble-3459518b-${{ runner.arch }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  format:
    name: swift-format lint
    runs-on: ubuntu-24.04
    container: swift:6.2-noble@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12 # 6.2-noble (6.2.4), multi-arch index
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      # The requiresMacSession tag skips nothing on its own; see scripts/check-mac-session-gate.sh.
      - name: Mac-session gate
        run: scripts/check-mac-session-gate.sh
